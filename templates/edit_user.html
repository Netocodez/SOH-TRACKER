{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <div class="card shadow-lg border-0 rounded-3">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Edit User</h4>
    </div>
    <div class="card-body">
      <form method="post" class="row g-3">
        <!-- Username and Password -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" name="username" class="form-control form-control-lg" 
                 value="{{ user.username }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Password 
            <small class="text-muted">(leave blank to keep current)</small>
          </label>
          <input type="password" name="password" class="form-control form-control-lg">
        </div>

        <!-- Role -->
        <div class="col-md-4">
          <label class="form-label fw-semibold">Role</label>
          <select name="role" class="form-select form-select-lg" required>
            <option value="super" {% if user.role=='super' %}selected{% endif %}>Superuser</option>
            <option value="cluster" {% if user.role=='cluster' %}selected{% endif %}>Cluster User</option>
            <option value="lga" {% if user.role=='lga' %}selected{% endif %}>LGA User</option>
            <option value="facility" {% if user.role=='facility' %}selected{% endif %}>Facility User</option>
          </select>
        </div>

        <!-- Cluster -->
        <div class="col-md-4">
          <label class="form-label fw-semibold">Cluster</label>
          <select id="clusterSelect" name="cluster_id" class="form-select form-select-lg">
            <option value="">-- Select Cluster --</option>
            {% for c in clusters %}
            <option value="{{ c.id }}" {% if user.cluster_id==c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- LGA -->
        <div class="col-md-4">
          <label class="form-label fw-semibold">LGA</label>
          <select id="lgaSelect" name="lga_id" class="form-select form-select-lg">
            <option value="">-- Select LGA --</option>
            {% for l in lgas %}
            <option value="{{ l.id }}" {% if user.lga_id==l.id %}selected{% endif %}>{{ l.name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Facility -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Facility</label>
          <select id="facilitySelect" name="facility_id" class="form-select form-select-lg">
            <option value="">-- Select Facility --</option>
            {% for f in facilities %}
            <option value="{{ f.id }}" {% if user.facility_id==f.id %}selected{% endif %}>{{ f.name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Buttons -->
        <div class="col-12 text-end pt-3">
          <button type="submit" class="btn btn-lg btn-primary px-4 me-2">
            <i class="bi bi-save"></i> Save Changes
          </button>
          <a href="{{ url_for('auth.list_users') }}" class="btn btn-lg btn-secondary px-4">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
const clusterSelect = document.getElementById('clusterSelect');
const lgaSelect = document.getElementById('lgaSelect');
const facilitySelect = document.getElementById('facilitySelect');

clusterSelect.addEventListener('change', function() {
  const clusterId = this.value;
  lgaSelect.innerHTML = '<option value="">-- Select LGA --</option>';
  facilitySelect.innerHTML = '<option value="">-- Select Facility --</option>';
  if (clusterId) {
    fetch(`/get_lgas/${clusterId}`)
      .then(r => r.json())
      .then(data => {
        data.forEach(l => {
          const opt = document.createElement('option');
          opt.value = l.id; opt.textContent = l.name; lgaSelect.appendChild(opt);
        });
      });
  }
});

lgaSelect.addEventListener('change', function() {
  const lgaId = this.value;
  facilitySelect.innerHTML = '<option value="">-- Select Facility --</option>';
  if (lgaId) {
    fetch(`/get_facilities/${lgaId}`)
      .then(r => r.json())
      .then(data => {
        data.forEach(f => {
          const opt = document.createElement('option');
          opt.value = f.id; opt.textContent = f.name; facilitySelect.appendChild(opt);
        });
      });
  }
});
</script>
{% endblock %}
