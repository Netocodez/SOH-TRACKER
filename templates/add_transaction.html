{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Add Stock Transaction</h5>
    </div>
    <div class="card-body">
      <form method="POST" class="row g-4">
        <!-- Location Section -->
        <h6 class="text-secondary">Location Details</h6>
        <div class="col-md-4">
          <label class="form-label fw-bold">Cluster</label>
          <select id="clusterSelect" class="form-select">
            <option value="">--Select Cluster--</option>
            {% for c in clusters %}
              <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">LGA</label>
          <select id="lgaSelect" class="form-select">
            <option value="">--Select LGA--</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">Facility</label>
          <select id="facilitySelect" name="facility" class="form-select" required>
            <option value="">--Select Facility--</option>
          </select>
        </div>

        <hr class="mt-4 mb-3">

        <!-- Product & Date Section -->
        <h6 class="text-secondary">Product & Transaction Details</h6>
        <div class="col-md-6">
          <label class="form-label fw-bold">Product</label>
          <select name="product" class="form-select" required>
            <option value="">--Select Product--</option>
            {% for p in products %}
              <option value="{{ p.id }}">{{ p.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Date</label>
          <input type="date" name="date" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-bold">Quantity</label>
          <input type="number" name="quantity" class="form-control" placeholder="Enter quantity" required>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">Transaction Type</label>
          <select name="transaction_type" class="form-select" required>
            <option value="">--Select Type--</option>
            <option value="Issued">Issued/Used</option>
            <option value="Opening">Opening</option>
            <option value="Received">Received</option>
            <option value="Adjusted">Adjusted</option>
            <option value="Lost">Lost</option>
            <option value="Damaged">Damaged</option>
            <option value="Expired">Expired</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">Expiry Date</label>
          <input type="date" name="expiry_date" class="form-control">
        </div>

        <!-- Reference & Batch Section -->
        <div class="col-md-6">
          <label class="form-label fw-bold">Reference Number</label>
          <input type="text" name="reference_number" class="form-control" placeholder="Optional">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Batch Number</label>
          <input type="text" name="batch_number" class="form-control" placeholder="Optional">
        </div>

        <div class="col-12 text-end mt-3">
          <button class="btn btn-success px-4">
            <i class="bi bi-plus-circle me-1"></i> Submit Transaction
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Cascading Dropdown Script -->
<script>
  const clusterSelect = document.getElementById('clusterSelect');
  const lgaSelect = document.getElementById('lgaSelect');
  const facilitySelect = document.getElementById('facilitySelect');

  clusterSelect.addEventListener('change', function() {
    const clusterId = this.value;
    lgaSelect.innerHTML = '<option value="">--Select LGA--</option>';
    facilitySelect.innerHTML = '<option value="">--Select Facility--</option>';
    if (clusterId) {
      fetch(`/get_lgas/${clusterId}`)
        .then(r => r.json())
        .then(data => {
          data.forEach(l => {
            const opt = document.createElement('option');
            opt.value = l.id; opt.textContent = l.name; lgaSelect.appendChild(opt);
          });
        });
    }
  });

  lgaSelect.addEventListener('change', function() {
    const lgaId = this.value;
    facilitySelect.innerHTML = '<option value="">--Select Facility--</option>';
    if (lgaId) {
      fetch(`/get_facilities/${lgaId}`)
        .then(r => r.json())
        .then(data => {
          data.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f.id; opt.textContent = f.name; facilitySelect.appendChild(opt);
          });
        });
    }
  });
</script>

{% endblock %}
