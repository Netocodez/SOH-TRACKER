{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Add Stock Update</h5>
    </div>
    <div class="card-body">
      <form method="POST" class="row g-4">
        
        <!-- Source Location Section -->
        <h6 class="text-secondary">Source Facility</h6>
        <div class="col-md-4">
          <label class="form-label fw-bold">Cluster</label>
          <select id="sourceCluster" class="form-select" required>
            <option value="">--Select Cluster--</option>
            {% for c in clusters %}
              <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">LGA</label>
          <select id="sourceLGA" class="form-select" required>
            <option value="">--Select LGA--</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">Facility</label>
          <select id="sourceFacility" name="facility" class="form-select" required>
            <option value="">--Select Facility--</option>
          </select>
        </div>

        <!-- Destination Location Section (only for Transfer) -->
        <div id="destinationSection" class="mt-4" style="display:none;">
          <hr class="mt-4 mb-3">
          <h6 class="text-secondary">Destination Facility</h6>
          <div class="row g-4">
            <div class="col-md-4">
              <label class="form-label fw-bold">Cluster</label>
              <select id="destCluster" class="form-select">
                <option value="">--Select Cluster--</option>
                {% for c in clusters %}
                  <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">LGA</label>
              <select id="destLGA" class="form-select">
                <option value="">--Select LGA--</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-bold">Facility</label>
              <select id="destFacility" name="destination_facility" class="form-select">
                <option value="">--Select Facility--</option>
              </select>
            </div>
          </div>
        </div>

        <hr class="mt-4 mb-3">

        <!-- Product & Transaction Details -->
        <h6 class="text-secondary">Product & Transaction Details</h6>
        <div class="col-md-6">
          <label class="form-label fw-bold">Product</label>
          <select name="product" class="form-select" required>
            <option value="">--Select Product--</option>
            {% for p in products %}
              <option value="{{ p.id }}">{{ p.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Date</label>
          <input type="date" name="date" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-bold">Quantity</label>
          <input type="number" name="quantity" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">Update Type</label>
          <select id="transactionType" name="transaction_type" class="form-select" required>
            <option value="">--Select Type--</option>
            <option value="Issued">Used</option>
            <option value="Opening">Opening</option>
            <option value="Received">Received</option>
            <!--<option value="Adjusted">Adjusted</option>-->
            <option value="Lost">Lost</option>
            <option value="Damaged">Damaged</option>
            <option value="Expired">Expired</option>
            <option value="Transfer">Transfer</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-bold">Expiry Date</label>
          <input type="date" name="expiry_date" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold">Reference Number</label>
          <input type="text" name="reference_number" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Batch Number</label>
          <input type="text" name="batch_number" class="form-control">
        </div>

        <div class="col-12">
          <label class="form-label fw-bold">Comments</label>
          <textarea name="comments" class="form-control" rows="2" placeholder="Optional comments"></textarea>
        </div>

        <div class="col-12 text-end mt-3">
          <button class="btn btn-success px-4">
            <i class="bi bi-plus-circle me-1"></i> Submit Data
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  const sourceCluster = document.getElementById('sourceCluster');
  const sourceLGA = document.getElementById('sourceLGA');
  const sourceFacility = document.getElementById('sourceFacility');

  const destCluster = document.getElementById('destCluster');
  const destLGA = document.getElementById('destLGA');
  const destFacility = document.getElementById('destFacility');

  const transactionType = document.getElementById('transactionType');
  const destinationSection = document.getElementById('destinationSection');

  // Show destination section only for Transfer
  transactionType.addEventListener('change', function () {
    if (this.value === 'Transfer') {
      destinationSection.style.display = 'block';
    } else {
      destinationSection.style.display = 'none';
      destCluster.value = "";
      destLGA.innerHTML = '<option value="">--Select LGA--</option>';
      destFacility.innerHTML = '<option value="">--Select Facility--</option>';
    }
  });

  // Cascade for Source
  sourceCluster.addEventListener('change', function() {
    sourceLGA.innerHTML = '<option value="">--Select LGA--</option>';
    sourceFacility.innerHTML = '<option value="">--Select Facility--</option>';
    if (this.value) {
      fetch(`/get_lgas/${this.value}`).then(r=>r.json()).then(data=>{
        data.forEach(l=>sourceLGA.add(new Option(l.name, l.id)));
      });
    }
  });

  sourceLGA.addEventListener('change', function() {
    sourceFacility.innerHTML = '<option value="">--Select Facility--</option>';
    if (this.value) {
      fetch(`/get_facilities/${this.value}`).then(r=>r.json()).then(data=>{
        data.forEach(f=>sourceFacility.add(new Option(f.name, f.id)));
      });
    }
  });

  // Cascade for Destination
  destCluster.addEventListener('change', function() {
    destLGA.innerHTML = '<option value="">--Select LGA--</option>';
    destFacility.innerHTML = '<option value="">--Select Facility--</option>';
    if (this.value) {
      fetch(`/get_lgas/${this.value}`).then(r=>r.json()).then(data=>{
        data.forEach(l=>destLGA.add(new Option(l.name, l.id)));
      });
    }
  });

  destLGA.addEventListener('change', function() {
    destFacility.innerHTML = '<option value="">--Select Facility--</option>';
    if (this.value) {
      fetch(`/get_facilities/${this.value}`).then(r=>r.json()).then(data=>{
        data.forEach(f=>{
          let opt = new Option(f.name, f.id);
          // prevent selecting same facility as source
          if (f.id == sourceFacility.value) {
            opt.disabled = true;
          }
          destFacility.add(opt);
        });
      });
    }
  });
</script>

{% endblock %}
